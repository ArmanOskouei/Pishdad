<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>آپدیت‌ها</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<link rel="stylesheet" href="../assets/css/tokens.css"><link rel="stylesheet" href="../assets/css/shell.css"><link rel="stylesheet" href="../assets/css/components.css">
<style>@media(max-width:640px){table.data thead{display:none}table.data,table.data tbody,table.data tr,table.data td{display:block;width:100%}table.data tr{border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:10px}table.data td{border:0;padding:8px 14px}}</style>
</head><body><div id="shell"></div>
<script src="../assets/js/mock.js"></script><script src="../assets/js/layout.js"></script>
<script>
shell({ panel: "central", active: "updates", title: "آپدیت‌ها", sub: "رول‌اوت پلکانی نسخه‌ها: پایلوت → بچ → همه" });
page(`<div class="card card-pad" style="margin-bottom:16px"><div class="card-title">رول‌اوت جاری: <b>v2.4.1</b></div><p class="card-sub">پایلوت ✓ → بچ ۱ (در حال اجرا) → همه</p>
<div class="progress"><i style="width:45%"></i></div><div style="display:flex;gap:8px;margin-top:10px;align-items:center"><span class="row-sub">۴۵٪ — ۲ از ۴ نصب</span><div style="flex:1"></div><button class="btn btn-ghost btn-sm" onclick="toast('رول‌اوت متوقف شد')">توقف</button><button class="btn btn-soft btn-sm" onclick="toast('ادامه به بچ بعدی')">ادامه رول‌اوت</button></div></div>
<div class="table-wrap"><table class="data"><thead><tr><th>نصب</th><th>نسخه فعلی</th><th>آخرین نسخه</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>
<tr><td><div class="row-main">فروشگاه نمونه</div></td><td dir="ltr">v2.4.1</td><td dir="ltr">v2.4.1</td><td>${badge("active")}</td><td><span class="row-sub">به‌روز ✓</span></td></tr>
<tr><td><div class="row-main">شرکت آریا</div></td><td dir="ltr">v2.3.0</td><td dir="ltr">v2.4.1</td><td><span class="badge b-amber">آپدیت موجود</span></td><td><button class="btn btn-soft btn-sm" onclick="upd('شرکت آریا')">آپدیت</button></td></tr>
<tr><td><div class="row-main">رستوران دیوان</div></td><td dir="ltr">v2.3.0</td><td dir="ltr">v2.4.1</td><td><span class="badge b-red">شکست‌خورده</span></td><td style="white-space:nowrap"><button class="btn btn-ghost btn-sm" onclick="upd('رستوران دیوان')">تلاش مجدد</button> <button class="btn btn-danger btn-sm" onclick="confirmDlg({title:'Rollback رستوران دیوان؟',text:'به نسخه پایدار v2.3.0 برمی‌گردد. این امن‌ترین مسیر است.',danger:true,ok:'Rollback',onOk:()=>toast('Rollback انجام شد ✓')})">Rollback</button></td></tr>
<tr><td><div class="row-main">کلینیک سپید</div><div class="row-sub">معلق — آپدیت متوقف</div></td><td dir="ltr">v2.2.0</td><td dir="ltr">v2.4.1</td><td>${badge("suspended")}</td><td><span class="row-sub">پس از رفع تعلیق</span></td></tr>
</tbody></table></div>`);
function upd(n) { confirmDlg({ title: `آپدیت ${n} به v2.4.1؟`, text: "بکاپ خودکار گرفته می‌شود و در صورت شکست Rollback برجسته پیشنهاد می‌گردد.", ok: "شروع آپدیت", onOk: () => toast(`آپدیت ${n} آغاز شد`) }); }
</script>
</body></html>
