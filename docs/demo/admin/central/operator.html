<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>پروفایل اپراتور</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<link rel="stylesheet" href="../assets/css/tokens.css"><link rel="stylesheet" href="../assets/css/shell.css"><link rel="stylesheet" href="../assets/css/components.css">
<style>.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}@media(max-width:820px){.two{grid-template-columns:1fr}}.kill{border:2px solid var(--danger);background:var(--danger-soft)}</style>
</head><body><div id="shell"></div>
<script src="../assets/js/mock.js"></script><script src="../assets/js/layout.js"></script>
<script>
shell({ panel: "central", active: "operator", title: "پروفایل اپراتور", sub: "امنیت سطح کارفرما — 2FA سخت‌افزاری + توکن راه‌اندازی" });
page(`<div class="two"><div>
<div class="card card-pad" style="margin-bottom:16px"><div class="card-title">احراز هویت دوعاملی سخت‌افزاری</div><p class="card-sub">کلید امنیتی (WebAuthn) — اجباری برای پنل مرکزی</p>
<div style="display:flex;gap:12px;align-items:center"><div style="width:90px;height:90px;border-radius:var(--radius-md);background:repeating-conic-gradient(var(--text) 0 25%,var(--surface) 0 50%) 0 0/14px 14px;border:1px solid var(--border)"></div><div><div>${badge("active")}</div><div class="row-sub" style="margin-top:6px">۲ کلید ثبت‌شده<br>آخرین استفاده: امروز ۰۸:۰۰</div></div></div>
<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn btn-soft btn-sm" onclick="toast('ثبت کلید جدید (دمو)')">افزودن کلید</button><button class="btn btn-ghost btn-sm" onclick="toast('کدهای بازیابی دانلود شد')">کدهای بازیابی</button></div></div>
<div class="card card-pad" style="margin-bottom:16px"><div class="card-title">توکن راه‌اندازی سوپرادمین</div><p class="card-sub">توکن یکبارمصرف per-install — پس از استفاده می‌سوزد (TTL: ۱۵ دقیقه)</p>
<div class="kv"><span>توکن فعال</span><span dir="ltr" style="font-family:monospace">otp_••••••9f3a</span></div>
<div class="kv"><span>انقضا</span><span>۱۲ دقیقه مانده</span></div>
<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn btn-ghost btn-sm" onclick="toast('توکن کپی شد ✓')">${ic("copy")} کپی</button><button class="btn btn-soft btn-sm" onclick="stepUp()">بازتولید (نیازمند step-up)</button></div></div>
<div class="card card-pad kill"><div class="card-title" style="color:var(--danger)">☠ Kill-Switch اضطراری</div><p class="card-sub">توقف فوری همه نصب‌ها — فقط برای نفوذ/فاجعه</p><button class="btn btn-danger btn-block" onclick="kill()">توقف اضطراری همه سرویس‌ها</button></div>
</div><div class="card card-pad"><div class="card-title">لاگ فعالیت اپراتور</div><p class="card-sub">ورود / دیپلوی / تولید توکن + IP</p><div class="timeline" style="margin-top:10px">
<div class="tl-item"><b>ورود موفق</b> — تهران<div class="t">امروز ۰۸:۰۰ — IP: 85.•••.••.12</div></div>
<div class="tl-item"><b>دیپلوی v2.4.1</b> — فروشگاه نمونه<div class="t">امروز ۰۶:۰۰</div></div>
<div class="tl-item"><b>تولید توکن پشتیبانی</b> — کلینیک سپید<div class="t">دیروز ۱۸:۲۰</div></div>
<div class="tl-item"><b>رفع تعلیق</b> — شرکت آریا<div class="t">۲ روز پیش</div></div>
<div class="tl-item"><b>ورود ناموفق</b> — ۳ تلاش<div class="t">۳ روز پیش — IP ناشناس — بلاک شد</div></div>
</div></div></div>`);
function stepUp() { openModal(`<div class="modal-head">تأیید step-up</div><div class="modal-body"><p style="font-size:13px">بازتولید توکن حساس است — کد 2FA را وارد کنید:</p><input class="input" dir="ltr" style="text-align:center;letter-spacing:8px" maxlength="6" placeholder="••••••"></div><div class="modal-foot"><button class="btn btn-primary" onclick="closeOver();toast('توکن جدید ساخته شد (TTL: ۱۵ دقیقه)')">تأیید و بازتولید</button><button class="btn btn-ghost" onclick="closeOver()">انصراف</button></div>`); }
function kill() { confirmDlg({ title: "توقف اضطراری؟", text: "همه ۴ نصب + سایت‌ها از دسترس خارج می‌شوند. این عمل در لاگ دائمی ثبت می‌گردد.", danger: true, ok: "می‌فهمم، متوقف کن", onOk: () => confirmDlg({ title: "تأیید دوم — کد 2FA", text: "برای اجرای Kill-Switch کد ۶ رقمی را در واقعیت وارد می‌کنید. (دمو: فقط تأیید)", danger: true, ok: "اجرای Kill-Switch", onOk: () => toast("Kill-Switch اجرا شد (دمو)") }) }); }
</script>
</body></html>
