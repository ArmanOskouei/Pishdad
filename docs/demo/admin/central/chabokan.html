<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مدیریت چابکان</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<link rel="stylesheet" href="../assets/css/tokens.css"><link rel="stylesheet" href="../assets/css/shell.css"><link rel="stylesheet" href="../assets/css/components.css">
<style>.mono{direction:ltr;text-align:left;font-family:Consolas,monospace;font-size:12px;background:var(--surface-2);border-radius:var(--radius-md);padding:10px 12px;overflow-x:auto}@media(max-width:640px){table.data thead{display:none}table.data,table.data tbody,table.data tr,table.data td{display:block;width:100%}table.data tr{border:1px solid var(--border);border-radius:var(--radius-md);margin-bottom:10px}table.data td{border:0;padding:8px 14px}}</style>
</head><body><div id="shell"></div>
<script src="../assets/js/mock.js"></script><script src="../assets/js/layout.js"></script>
<script>
shell({ panel: "central", active: "chabokan", title: "مدیریت چابکان", sub: "Ops Console — کیف پول، استخر، سرویس‌ها، دیپلوی" });
actions(`<button class="btn btn-primary" onclick="toast('دیپلوی مجدد همه (دمو)')">${ic("sync")} دیپلوی مجدد</button>`);
const svc = [
  ["فروشگاه نمونه", "Laravel API", "active", "Standard-2"],
  ["فروشگاه نمونه", "Next.js", "active", "Standard-1"],
  ["کلینیک سپید", "Laravel API", "suspended", "Budget-1"],
  ["رستوران دیوان", "PostgreSQL", "active", "Shared"],
];
page(`<div class="grid c2" style="margin-bottom:16px">
<div class="card card-pad" style="border-inline-start:3px solid var(--danger)"><div class="card-sub">موجودی کیف پول چابکان</div><div style="font-size:24px;font-weight:800">۴٫۲ میلیون <small style="font-size:12px;font-weight:400">تومان</small></div><div class="row-sub">≈ ۱٫۸ ماه شارژ — <b style="color:var(--danger)">زیر آستانه ۲ ماه!</b></div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn btn-primary btn-sm" onclick="toast('انتقال به درگاه شارژ (دمو)')">شارژ کیف پول</button></div></div>
<div class="card card-pad" style="border-inline-start:3px solid var(--warning)"><div class="card-sub">استخر سرویس آماده (Idle)</div><div style="font-size:24px;font-weight:800">۲ <small style="font-size:12px;font-weight:400">سرویس</small></div><div class="row-sub">برای نصب فوری مشتری جدید — هشدار خالی‌بودن</div><button class="btn btn-ghost btn-sm" style="margin-top:10px" onclick="toast('ساخت سرویس Idle جدید آغاز شد')">ساخت سرویس آماده</button></div></div>
<div class="card card-pad" style="margin-bottom:16px"><div class="card-title">سرویس‌های مشتریان <span class="badge b-gray">StatusBadge + ActionMatrix</span></div>
<div class="table-wrap" style="border:0"><table class="data"><thead><tr><th>مشتری / سرویس</th><th>وضعیت</th><th>سایز</th><th>اکشن مجاز</th></tr></thead><tbody>
${svc.map(s => `<tr><td><div class="row-main">${s[0]}</div><div class="row-sub">${s[1]}</div></td><td>${badge(s[2])}</td><td>${s[3]}</td><td style="white-space:nowrap"><button class="btn btn-ghost btn-sm" onclick="cf('Restart','${s[0]} — ${s[1]}')">Restart</button> <button class="btn btn-ghost btn-sm" onclick="cf('${s[2] === "active" ? "Stop" : "Start"}','${s[0]} — ${s[1]}')">${s[2] === "active" ? "Stop" : "Start"}</button> <button class="btn btn-soft btn-sm" onclick="cf('Resize','${s[0]} — ${s[1]}')">Resize</button></td></tr>`).join("")}
</tbody></table></div></div>
<div class="grid c2" style="align-items:start">
<div class="card card-pad"><div class="card-title">دیپلوی‌ها</div><div class="timeline" style="margin-top:10px">
<div class="tl-item"><b>v2.4.1</b> — فروشگاه نمونه — موفق<div class="t">امروز ۰۶:۰۰</div></div>
<div class="tl-item"><b>v2.4.1</b> — رستوران دیوان — <b style="color:var(--danger)">ناموفق</b> <a href="#" onclick="toast('دیپلوی مجدد آغاز شد');return false" style="color:var(--primary)">دیپلوی مجدد</a><div class="t">دیروز ۲۳:۱۲</div></div>
<div class="tl-item"><b>v2.4.0</b> — همه — موفق<div class="t">۳ روز پیش</div></div></div></div>
<div class="card card-pad"><div class="card-title">Reconciliation</div><p class="card-sub">تطبیق وضعیت واقعی چابکان با دیتابیس مرکزی</p>
<div class="kv"><span>آخرین بررسی</span><span>۱۰ دقیقه پیش</span></div><div class="kv"><span>مغایرت</span><span style="color:var(--success)">۰ مورد ✓</span></div>
<div class="mono" style="margin-top:10px">reconcile --all → 12 services OK<br>pool.idle=2, wallet=4.2M IRR</div>
<button class="btn btn-ghost btn-sm" style="margin-top:10px" onclick="toast('Reconciliation دستی اجرا شد ✓')">اجرای دستی</button></div></div>`);
function cf(a, n) { confirmDlg({ title: `${a} — ${n}؟`, text: "این عملیات روی سرویس واقعی چابکان اجرا می‌شود و لاگ می‌گردد.", danger: a === "Stop", ok: "اجرا", onOk: () => toast(`${a} اجرا شد ✓`) }); }
</script>
</body></html>
