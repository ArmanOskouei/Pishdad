<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>داشبورد مرکزی</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<link rel="stylesheet" href="../assets/css/tokens.css"><link rel="stylesheet" href="../assets/css/shell.css"><link rel="stylesheet" href="../assets/css/components.css">
<style>.bars{display:flex;align-items:flex-end;gap:8px;height:110px;padding-top:8px}.bars i{flex:1;border-radius:6px 6px 0 0;background:var(--primary);opacity:.85;min-height:8px}.line{height:90px;position:relative}.line svg{width:100%;height:100%}.act{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px dashed var(--border);font-size:13px}.act:last-child{border:0}</style>
</head><body><div id="shell"></div>
<script src="../assets/js/mock.js"></script><script src="../assets/js/layout.js"></script>
<script>
shell({ panel: "central", active: "cdash", title: "داشبورد مرکزی", sub: "نگاه اول صبح کارفرما — امروز ۲ مهر ۱۴۰۵" });
actions(`<button class="btn btn-primary" onclick="location.href='clients.html'">${ic("plus")} مشتری جدید</button>`);
const S = [
  { t: "مشتریان فعال", v: "۳", d: "+۱ این ماه", up: true, ic: "users", c: "var(--primary-soft)|var(--primary)" },
  { t: "درآمد ماه", v: "۲٫۶ م", d: "+۱۸٪", up: true, ic: "wallet", c: "var(--success-soft)|var(--success)" },
  { t: "معلق / در خطر", v: "۱", d: "کلینیک سپید", up: false, ic: "alert", c: "var(--danger-soft)|var(--danger)" },
  { t: "هشدار استخر", v: "۲", d: "سرویس Idle کم", up: false, ic: "server", c: "var(--warning-soft)|var(--warning)" },
];
page(`<div class="grid c4 m1" style="margin-bottom:16px">${S.map(s => { const [bg, fg] = s.c.split("|"); return `<div class="card stat"><div class="stat-ic" style="background:${bg};color:${fg}">${ic(s.ic)}</div><div><div class="stat-num">${s.v}</div><div class="stat-lbl">${s.t}</div><div class="stat-delta ${s.up ? "up" : "down"}">${s.d}</div></div></div>`; }).join("")}</div>
<div class="grid c2" style="align-items:start"><div class="card card-pad"><div class="card-title">⚡ پرونده‌های باز (قابل اکشن)</div>
  <div class="act"><span class="badge b-red">کیف پول</span><div>موجودی زیر ۲ ماه شارژ <div class="row-sub">۱٫۸ ماه باقی‌مانده</div></div><button class="btn btn-soft btn-sm" style="margin-inline-start:auto" onclick="location.href='chabokan.html'">شارژ</button></div>
  <div class="act"><span class="badge b-amber">استخر</span><div>فقط ۲ سرویس Idle <div class="row-sub">برای نصب جدید کم است</div></div><button class="btn btn-ghost btn-sm" style="margin-inline-start:auto" onclick="location.href='chabokan.html'">استخر</button></div>
  <div class="act"><span class="badge b-amber">تعلیق</span><div>کلینیک سپید — ۳ روز تا حذف <div class="row-sub">معلق از ۲۸ شهریور</div></div><button class="btn btn-ghost btn-sm" style="margin-inline-start:auto" onclick="location.href='billing.html'">کنترل تعلیق</button></div>
  <div class="act"><span class="badge b-red">دیپلوی</span><div>۱ دیپلوی ناموفق دیشب <div class="row-sub">رستوران دیوان</div></div><button class="btn btn-ghost btn-sm" style="margin-inline-start:auto" onclick="location.href='chabokan.html'">بررسی</button></div>
</div><div>
  <div class="card card-pad" style="margin-bottom:16px"><div class="card-title">درآمد ۶ ماه (میلیون تومان)</div><div class="bars">${[40, 55, 50, 70, 66, 90].map(h => `<i style="height:${h}%"></i>`).join("")}</div><div class="row-sub">فروردین تا شهریور — صعودی</div></div>
  <div class="card card-pad"><div class="card-title">رشد مشتریان</div><div class="line"><svg viewBox="0 0 200 80" preserveAspectRatio="none"><polyline points="0,70 40,60 80,62 120,45 160,40 200,20" fill="none" stroke="var(--primary)" stroke-width="3" stroke-linecap="round"/></svg></div><div class="row-sub">۴ نصب فعال — هدف مهر: ۶</div></div>
</div></div>`);
</script>
</body></html>
