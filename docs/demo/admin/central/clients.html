<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مدیریت مشتریان</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<link rel="stylesheet" href="../assets/css/tokens.css"><link rel="stylesheet" href="../assets/css/shell.css"><link rel="stylesheet" href="../assets/css/components.css">
</head><body><div id="shell"></div>
<script src="../assets/js/mock.js"></script><script src="../assets/js/layout.js"></script>
<script>
shell({ panel: "central", active: "clients", title: "مدیریت مشتریان", sub: "ساخت، ارتقا، تعلیق و پشتیبانی نصب‌ها" });
actions(`<button class="btn btn-primary" onclick="newClient()">${ic("plus")} مشتری جدید + نصب</button>`);
const rows = M.clients.map((c, i) => `<tr><td><div class="row-main">${c.n}</div><div class="row-sub">عضویت ${c.d}</div></td><td><span class="badge b-violet">${c.t}</span></td><td>${badge(c.s)}</td><td><div style="display:flex;align-items:center;gap:6px"><div class="progress" style="width:70px"><i style="width:${c.h}%"></i></div><small>${c.h}٪</small></div></td><td>${c.due}</td><td style="white-space:nowrap"><button class="btn btn-soft btn-sm" onclick="clientDetail(${i})">جزئیات</button></td></tr>`).join("");
page(`<div class="toolbar"><div class="search-box">${ic("search")}<input class="input" id="q" placeholder="جستجوی مشتری…"></div><select class="select"><option>همه تیرها</option><option>Budget</option><option>Standard</option><option>Enterprise</option></select><select class="select"><option>همه وضعیت‌ها</option><option>فعال</option><option>معلق</option></select></div>
<div class="table-wrap"><table class="data" id="tbl"><thead><tr><th>مشتری</th><th>تیر</th><th>وضعیت</th><th>سلامت</th><th>سررسید</th><th>عملیات</th></tr></thead><tbody>${rows}</tbody></table><div class="pager">۴ مشتری فعال</div></div>`);
bindTable("q", "tbl");
function clientDetail(i) {
  const c = M.clients[i];
  openDrawer(`<div class="modal-head">${c.n} <span style="margin-inline-start:auto">${badge(c.s)}</span></div>
  <div class="modal-body"><div class="tabs"><button class="tab active" onclick="dTab(this,'d1')">اطلاعات</button><button class="tab" onclick="dTab(this,'d2')">سرویس‌ها</button><button class="tab" onclick="dTab(this,'d3')">بکاپ‌ها</button><button class="tab" onclick="dTab(this,'d4')">فاکتورها</button></div>
  <div class="tabpane active" id="d1"><div class="kv"><span>تیر سرویس</span><span>${c.t}</span></div><div class="kv"><span>سلامت نصب</span><span>${c.h}٪</span></div><div class="kv"><span>سررسید</span><span>${c.due}</span></div>
    <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><button class="btn btn-soft btn-sm" onclick="toast('توکن یکبارمصرف ساخته شد (TTL: ۱۵ دقیقه)')">${ic("key")} توکن پشتیبانی</button><button class="btn btn-ghost btn-sm" onclick="toast('توکن کپی شد ✓')">${ic("copy")} کپی</button></div></div>
  <div class="tabpane" id="d2"><div class="kv"><span>Laravel API</span><span>${badge("active")}</span></div><div class="kv"><span>Next.js</span><span>${badge("active")}</span></div><div class="kv"><span>PostgreSQL</span><span>${badge("active")}</span></div><button class="btn btn-ghost btn-sm" style="margin-top:10px" onclick="toast('بازشدن در چابکان…')">مدیریت در چابکان</button></div>
  <div class="tabpane" id="d3"><div class="kv"><span>آخرین بکاپ</span><span>امروز ۰۳:۰۰ — موفق</span></div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn btn-ghost btn-sm" onclick="toast('بکاپ دستی شروع شد')">بکاپ جدید</button><button class="btn btn-ghost btn-sm" onclick="toast('بازیابی آغاز شد')">بازیابی</button></div></div>
  <div class="tabpane" id="d4"><div class="kv"><span>فاکتور ۱۰۴۲</span><span>${badge("unpaid")}</span></div><div class="kv"><span>فاکتور ۱۰۳۱</span><span>${badge("paid")}</span></div></div>
  </div><div class="modal-foot"><button class="btn btn-soft btn-sm" onclick="upgrade('${c.n}')">ارتقا تیر</button><button class="btn ${c.s === "active" ? "btn-danger-soft" : "btn-success"} btn-sm" onclick="closeOver();toast('${c.s === "active" ? "مشتری معلق شد" : "مشتری فعال شد"}')">${c.s === "active" ? "تعلیق" : "رفع تعلیق"}</button></div>`);
}
function dTab(btn, id) { btn.parentElement.querySelectorAll(".tab").forEach(t => t.classList.remove("active")); btn.parentElement.parentElement.querySelectorAll(".tabpane").forEach(p => p.classList.remove("active")); btn.classList.add("active"); document.getElementById(id).classList.add("active"); }
function upgrade(n) {
  confirmDlg({ title: "ارتقا Budget ← Standard", text: `${n}: مهاجرت به سرویس بزرگ‌تر + فاکتور مابه‌التفاوت. حین ارتقا سایت ۲ دقیقه در دسترس نیست.`, ok: "شروع ارتقا", onOk: () => toast("ارتقا آغاز شد — پیشرفت در چابکان") });
}
function newClient() {
  openModal(`<div class="modal-head">مشتری جدید + نصب خودکار</div><div class="modal-body"><div class="form-grid"><div class="field"><label>نام مشتری</label><input class="input" placeholder="مثلاً شرکت نمونه"></div><div class="field"><label>تیر سرویس</label><select class="select"><option>Budget</option><option>Standard</option><option>Enterprise</option></select></div><div class="field full"><label>دامنه</label><input class="input" dir="ltr" style="text-align:left" placeholder="example.com"></div></div><div class="alert a-blue">${ic("info")}<div>پس از ثبت، نصب Laravel + Next + دیتابیس به‌صورت خودکار در چابکان ساخته می‌شود.</div></div></div><div class="modal-foot"><button class="btn btn-primary" onclick="closeOver();toast('مشتری ساخته و نصب آغاز شد ✓')">ثبت و نصب</button><button class="btn btn-ghost" onclick="closeOver()">انصراف</button></div>`);
}
</script>
</body></html>
