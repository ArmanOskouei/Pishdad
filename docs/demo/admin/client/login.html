<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ورود به پنل مدیریت</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/components.css">
<style>
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:16px}
.login-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);box-shadow:var(--shadow-lg);padding:32px 28px}
.login-brand{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:24px;text-align:center}
.otp{display:flex;gap:8px;justify-content:center;direction:ltr;margin:8px 0 16px}
.otp input{width:48px;height:54px;text-align:center;font-size:20px;font-weight:800;font-family:inherit;border:1.5px solid var(--border);border-radius:var(--radius-md);background:var(--surface);color:var(--text);outline:none}
.otp input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
</style>
</head><body data-direction="amaliyat" data-theme="dark" data-accent="indigo">
<div class="login-card">
  <div class="login-brand">
    <div class="brand-mark" style="width:52px;height:52px;font-size:24px">س</div>
    <b style="font-size:17px">ورود به پنل مدیریت</b>
    <span style="font-size:12.5px;color:var(--text-muted)">فروشگاه نمونه — site.com/admin</span>
  </div>
  <div id="st1">
    <div class="stepper"><div class="step now"><span class="n">۱</span> رمز عبور</div><div class="step-line"></div><div class="step"><span class="n">۲</span> تأیید دومرحله‌ای</div></div>
    <div class="field"><label>ایمیل</label><input class="input" value="admin@example.com" dir="ltr" style="text-align:left"></div>
    <div class="field"><label>رمز عبور</label><input class="input" type="password" value="12345678" dir="ltr" style="text-align:left"></div>
    <button class="btn btn-primary btn-block" onclick="go2()">ادامه</button>
    <p style="text-align:center;font-size:12.5px;color:var(--text-muted);margin:14px 0 0"><a href="#" onclick="toast('لینک بازیابی ارسال شد');return false" style="color:var(--primary)">فراموشی رمز؟</a></p>
  </div>
  <div id="st2" style="display:none">
    <div class="stepper"><div class="step done"><span class="n">✓</span> رمز عبور</div><div class="step-line"></div><div class="step now"><span class="n">۲</span> تأیید دومرحله‌ای</div></div>
    <p style="font-size:13px;color:var(--text-muted);text-align:center">کد ۶ رقمی اپ احراز هویت را وارد کنید</p>
    <div class="otp"><input maxlength="1"><input maxlength="1"><input maxlength="1"><input maxlength="1"><input maxlength="1"><input maxlength="1"></div>
    <button class="btn btn-primary btn-block" onclick="location.href='dashboard.html'">تأیید و ورود</button>
    <button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="back1()">بازگشت</button>
  </div>
  <div style="margin-top:18px;padding-top:14px;border-top:1px dashed var(--border);font-size:12px;color:var(--text-muted);text-align:center">
    دموی حالت تعلیق: <a href="subscription.html?suspended=1" style="color:var(--danger);font-weight:700">ورود با حساب معلق</a>
  </div>
</div>
<script src="../assets/js/layout.js"></script>
<script>
const go2 = () => { st1.style.display = "none"; st2.style.display = "block"; document.querySelector(".otp input").focus(); };
const back1 = () => { st2.style.display = "none"; st1.style.display = "block"; };
document.querySelectorAll(".otp input").forEach((el, i, arr) => el.oninput = () => { if (el.value && arr[i + 1]) arr[i + 1].focus(); });
</script>
</body></html>
