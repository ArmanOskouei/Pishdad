<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>اشتراک به پایان رسیده</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<link rel="stylesheet" href="../assets/css/tokens.css"><link rel="stylesheet" href="../assets/css/components.css">
<style>body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:20px;text-align:center}.box{max-width:480px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);box-shadow:var(--shadow-lg);padding:40px 32px}.big{width:76px;height:76px;border-radius:50%;background:var(--danger-soft);color:var(--danger);display:grid;place-items:center;margin:0 auto 16px}.big svg{width:36px;height:36px}</style>
</head><body data-direction="sahar" data-theme="light">
<div class="box">
  <div class="big"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
  <h1 style="font-size:19px;margin:0 0 8px">اشتراک هاست شما به پایان رسیده است</h1>
  <p style="color:var(--text-muted);font-size:13.5px;line-height:2;margin:0 0 6px">نمایش سایت شما موقتاً متوقف شده است.<br>برای فعال‌سازی مجدد، لطفاً با پشتیبانی تماس بگیرید.</p>
  <div class="kv" style="text-align:right;margin:16px 0"><span>وضعیت</span><span style="color:var(--danger)">معلق — ۳ روز تا حذف خودکار</span></div>
  <button class="btn btn-primary btn-block" onclick="toast('تماس با پشتیبانی: ۰۲۱-۰۰۰۰۰۰۰۰ (دمو)')">تماس با پشتیبانی</button>
  <p class="hint" style="margin-top:12px">صفحه عمومی سمت سایت — عمداً هیچ لینکی به ‎/admin‎ ندارد.</p>
</div>
<script src="../assets/js/layout.js"></script>
</body></html>
