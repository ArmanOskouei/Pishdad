      summary: لیست پلاگین‌ها (تسک ۵.۴)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: لیست }
  /api/v1/admin/plugins/upload:
    post:
      summary: آپلود پلاگین (ZIP + manifest.json + امضای Ed25519 اجباری؛ نامعتبر = 422 + لاگ امنیتی؛ آپلود مشتری review_status=pending می‌شود) (تسک ۵.۴ + مورد ۶)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: نصب شد (pending — در انتظار تأیید مرکزی)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plugin' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/admin/plugins/{id}:
    get:
      summary: وضعیت پلاگین + checksum + خلاصهٔ اعتماد (trust) + وضعیت بازبینی و دلیل رد (تسک ۵.۴ + مورد ۶)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: پلاگین
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Plugin' }
        '404': { description: پلاگین یافت نشد }
  /api/v1/admin/plugins/{id}/activate:
    post:
      summary: فعال‌سازی + ساخت پرمیشن‌های اعلام‌شده در مانیفست (pending/rejected بدون تأیید مرکزی = 422) (تسک ۵.۴ + مورد ۶)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: فعال شد }
        '422': { description: هنوز تأیید نشده یا رد شده است }
  /api/v1/admin/plugins/{id}/deactivate:
    post:
      summary: غیرفعال‌سازی (سیستمی = 422) (تسک ۵.۴)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: غیرفعال شد }
        '422': { description: پلاگین سیستمی محافظت می‌شود }
  /api/v1/admin/plugins/{id}/upgrade:
    post:
      summary: ارتقا به نسخه بالاتر امضاشده (rollback نسخه قبلی ثبت می‌شود) (تسک ۵.۴)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: به‌روزرسانی شد }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/admin/plugins/{id}/uninstall:
    post:
      summary: حذف پلاگین (سیستمی = 422) (تسک ۵.۴)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: حذف شد }
        '422': { description: پلاگین سیستمی محافظت می‌شود }
  /api/internal/heartbeat:
    post:
      summary: heartbeat نصب (توکن per-install + HMAC + ضد replay؛ upsert وضعیت) (تسک ۵.۵)
      parameters:
        - { name: X-Install-Token, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [site_id, timestamp, signature]
              properties:
                site_id: { type: string }
                status: { type: string, enum: [online, degraded, down] }
                version: { type: string }
                timestamp: { type: integer }
                signature: { type: string, description: 'HMAC-SHA256("{site_id}|{status}|{timestamp}", install_token)' }
      responses:
        '200': { description: ثبت شد }
        '401': { description: احراز هویت/امضا نامعتبر }
  /api/central/monitoring/health:
    get:
      summary: گرید سلامت نصب‌ها + لیست ساکت‌ها (تسک ۵.۵)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: silent_minutes, in: query, required: false, schema: { type: integer, default: 10 } }
      responses:
        '200': { description: گرید سلامت }
  /api/central/monitoring/logs:
    get:
      summary: لاگ متمرکز (فیلتر level/site + جستجوی متنی q در message/site_id + صفحه‌بندی — فقط ۳۰ روز) (تسک ۵.۵ + دسته UIUX)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: level, in: query, required: false, schema: { type: string } }
        - { name: site_id, in: query, required: false, schema: { type: string } }
        - { name: q, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: لاگ‌ها }
  /api/central/monitoring/uptime:
    get:
      summary: آپتایم روزانه هر نصب (پیش‌فرض ۳۰ روز؛ فقط امروز واقعی، گذشته unknown — تاریخچه TODO) (دسته UIUX)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: days, in: query, required: false, schema: { type: integer } }
        - { name: silent_minutes, in: query, required: false, schema: { type: integer } }
      responses:
        '200': { description: سری روزانه per-client }
        '403': { description: فقط اپراتور مرکزی }
  /api/central/updates:
    get:
      summary: رجیستری نسخه‌ها + نسخه هر نصب + آخرین وضعیت رول‌اوت هر نصب (last_rollout_status) (تسک ۵.۶ + دسته UIUX)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: رجیستری }
  /api/central/updates/rollouts/current:
    get:
      summary: کارت رول‌اوت جاری (آخرین in_progress/paused + پیشرفت شمارشی) (دسته UIUX)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: رول‌اوت جاری یا null }
        '403': { description: فقط اپراتور مرکزی }
  /api/central/updates/rollouts/{id}/pause:
    post:
      summary: توقف موقت رول‌اوت در حال اجرا (دسته UIUX)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: رول‌اوت متوقف شد }
        '422': { description: فقط رول‌اوت در حال اجرا }
  /api/central/updates/rollouts/{id}/resume:
    post:
      summary: ادامه رول‌اوت متوقف‌شده (دسته UIUX)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: رول‌اوت ادامه یافت }
        '422': { description: فقط رول‌اوت متوقف‌شده }
  /api/central/updates/rollout:
    post:
      summary: رول‌اوت پلکانی (بچ‌بندی + confirm:true + رکورد per-install؛ بدون canary) (تسک ۵.۶)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: string }
                install_ids: { type: array, items: { type: integer } }
                batch_size: { type: integer }
                confirm: { type: boolean }
      responses:
        '201': { description: رول‌اوت ثبت شد }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/central/updates/installs/{id}/rollback:
    post:
      summary: بازگشت نصب به نسخه قبلی ثبت‌شده (تسک ۵.۶)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: بازگشت انجام شد }
        '422': { description: نسخه قبلی ثبت نشده }
  /api/central/review/queue:
    get:
      summary: صف بازبینی مرکزی — پلاگین‌ها و قالب‌های pending با مالک (مورد ۶)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: صف بازبینی
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ReviewQueueItem' } }
                  total: { type: integer }
        '403': { description: فقط اپراتور مرکزی }
  /api/central/review/{type}/{id}/approve:
    post:
      summary: تأیید مورد و آزادسازی فعال‌سازی برای مشتری (مورد ۶)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: type, in: path, required: true, schema: { type: string, enum: [plugin, theme] } }
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: تأیید شد }
        '403': { description: فقط اپراتور مرکزی }
        '404': { description: مورد یافت نشد }
  /api/central/review/{type}/{id}/reject:
    post:
      summary: رد مورد با دلیل اجباری (note) — دلیل برای مشتری نمایش داده می‌شود (مورد ۶)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: type, in: path, required: true, schema: { type: string, enum: [plugin, theme] } }
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, minLength: 5, maxLength: 2000 }
      responses:
        '200': { description: رد شد و دلیل ثبت شد }
        '403': { description: فقط اپراتور مرکزی }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/central/operator/2fa/hardware/setup:
    get:
      summary: صدور secret موقت + otpauth_url برای ثبت کلید با QR (دسته UIUX)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: secret و otpauth_url }
        '403': { description: فقط اپراتور مرکزی }
  /api/central/operator/2fa/hardware:
    post:
      summary: ثبت کلید سخت‌افزاری (فعلاً TOTP سخت‌افزاری؛ WebAuthn واقعی TODO) (تسک ۵.۷)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, secret, code]
              properties:
                name: { type: string }
                secret: { type: string }
                code: { type: string }
      responses:
        '201': { description: کلید ثبت شد }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/central/operator/setup-tokens:
    post:
      summary: توکن نصب با TTL (نیازمند 2FA تازه <۵ دقیقه؛ متن فقط یک‌بار) (تسک ۵.۷)
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: توکن ساخته شد }
        '403': { description: نیازمند تأیید دومرحله‌ای تازه }
  /api/central/operator/kill-switch:
    post:
      summary: توقف اضطراری دومرحله‌ای (confirm:true + دلیل اجباری + 2FA تازه + لاگ غیرقابل حذف) (تسک ۵.۷)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
                confirm: { type: boolean }
      responses:
        '200': { description: ثبت شد }
        '403': { description: نیازمند تأیید دومرحله‌ای تازه }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/central/operator/activity:
    get:
      summary: لاگ فعالیت اپراتور (تسک ۵.۷)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: لاگ فعالیت }
  /api/central/tickets/{id}/reply:
    post:
      summary: پاسخ اپراتور روی تیکت مشتری + اعلان داخلی (تسک ۵.۳)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '201': { description: پاسخ ثبت شد }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  schemas:
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { type: string }
        google2fa_enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        created_at_jalali: { type: string, example: '1405/07/01 12:00' }
    TokenResponse:
      type: object
      properties:
        token: { type: string }
        token_type: { type: string, example: Bearer }
        two_factor_required: { type: boolean, example: false }
        user: { $ref: '#/components/schemas/User' }
    ChallengeResponse:
      type: object
      properties:
        two_factor_required: { type: boolean, example: true }
        challenge: { type: string, format: uuid }
        message: { type: string }
    UiSettings:
      type: object
      properties:
        dir: { type: string, enum: [rtl, ltr], example: rtl }
        preset: { type: string, enum: [sahar, amaliyat, arya, narm, divan], example: amaliyat }
        mode: { type: string, enum: [light, dark, system], example: dark }
        radius: { type: string, enum: [sharp, default, rounded], example: sharp }
        density: { type: string, enum: [compact, comfortable, loose], example: compact }
        font: { type: string, enum: [sm, md, lg], example: md }
        bottom_nav:
          type: array
          maxItems: 6
          items:
            type: string
            enum: [/admin/dashboard, /admin/pages, /admin/media, /admin/tickets, /admin/header-footer, /admin/settings, /admin/managers, /admin/profile, /admin/subscription, /admin/blocks, /admin/themes, /admin/appearance, /admin/plugins, /admin/socials]
          example: [/admin/dashboard, /admin/pages, /admin/media, /admin/tickets, /admin/header-footer, /admin/settings]
    SiteSettings:
      type: object
      properties:
        title: { type: string, example: 'وب‌سایت من' }
        description: { type: string, example: 'توضیح کوتاه سایت' }
        logo_media_id: { type: integer, nullable: true }
        favicon_media_id: { type: integer, nullable: true }
        logo_url: { type: string, nullable: true, description: 'نشانی نمایشی لوگو — سرور غنی می‌کند (حل path با AWS_URL، وگرنه null)' }
        favicon_url: { type: string, nullable: true, description: 'نشانی نمایشی فاوآیکون — سرور غنی می‌کند' }
        phone: { type: string, nullable: true, example: '09123456789' }
        email: { type: string, nullable: true, example: 'info@example.com' }
        site_url: { type: string, nullable: true, example: 'https://example.ir', description: 'نشانی پایه سایت — canonical و OG:url و sitemap/llms از همین ساخته می‌شود' }
        og_image_media_id: { type: integer, nullable: true, description: 'تصویر پیش‌فرض اشتراک‌گذاری (OG/Twitter)' }
        og_image_url: { type: string, nullable: true, description: 'نشانی نمایشی تصویر OG — سرور غنی می‌کند' }
        ai_summary: { type: string, nullable: true, example: 'فروشگاه اینترنتی کالای ایرانی.', description: 'خلاصه ۱-۲ جمله‌ای سایت برای llms.txt و موتورهای هوش مصنوعی (حداکثر ۱۰۰۰ نویسه)' }
        robots_index: { type: boolean, example: true, description: 'اجازه ایندکس کل سایت (false = noindex سراسری)' }
        address: { type: string, nullable: true, example: 'تهران، خیابان مثال', description: 'نشانی فیزیکی — JSON-LD سازمان' }
        locale: { type: string, enum: [fa, en], example: fa, description: 'زبان پیش‌فرض سایت (دسته UIUX)' }
        timezone: { type: string, enum: [Asia/Tehran, Asia/Dubai, Europe/London, UTC], example: Asia/Tehran, description: 'منطقه زمانی سایت (دسته UIUX)' }
        homepage_page_id: { type: integer, nullable: true, description: 'شناسه صفحه خانه منتشرشده و مشترک نصب' }
    SocialLink:
      type: object
      required: [key, url]
      properties:
        key: { type: string, enum: [instagram, telegram, x, linkedin, aparat, youtube, facebook, whatsapp, website], example: instagram }
        url: { type: string, example: 'https://instagram.com/mypage' }
        active: { type: boolean, example: true }
        label: { type: string, nullable: true, description: 'برچسب نمایشی شبکه سفارشی — اگر نباشد از نام فارسی پیش‌فرض استفاده می‌شود' }
        icon_media_id: { type: integer, nullable: true, description: 'شناسه لوگوی سفارشی در کتابخانه' }
        icon_url: { type: string, nullable: true, description: 'نشانی نمایشی لوگو — سرور غنی می‌کند' }
    Plugin:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        version: { type: string }
        previous_version: { type: string, nullable: true }
        active: { type: boolean }
        system: { type: boolean }
        signature_valid: { type: boolean }
        review_status: { type: string, enum: [pending, approved, rejected], description: 'وضعیت بازبینی مرکزی (مورد ۶) — آپلود مشتری pending می‌شود' }
        review_note: { type: string, nullable: true, description: 'دلیل رد (فقط وقتی rejected)' }
        submitted_at: { type: string, format: date-time, nullable: true }
        reviewed_at: { type: string, format: date-time, nullable: true }
        checksum: { type: string, description: 'sha256 فایل ZIP' }
        manifest: { type: object, nullable: true }
    Theme:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        version: { type: string }
        active: { type: boolean }
        signature_valid: { type: boolean }
        review_status: { type: string, enum: [pending, approved, rejected], description: 'وضعیت بازبینی مرکزی (مورد ۶)' }
        review_note: { type: string, nullable: true, description: 'دلیل رد (فقط وقتی rejected)' }
        submitted_at: { type: string, format: date-time, nullable: true }
        reviewed_at: { type: string, format: date-time, nullable: true }
        manifest: { type: object, nullable: true }
    ReviewQueueItem:
      type: object
      properties:
        type: { type: string, enum: [plugin, theme] }
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        version: { type: string }
        signature_valid: { type: boolean }
        submitted_at: { type: string, format: date-time, nullable: true }
        manifest: { type: object, nullable: true }
        owner: { type: object, nullable: true, properties: { id: { type: integer }, name: { type: string }, email: { type: string } } }
    LayoutPayload:
      type: object
      properties:
        widgets:
          type: array
          items:
            type: object
            required: [type]
            properties:
              type: { type: string, example: nav }
              settings:
                type: object
                description: 'تنظیمات ویجت؛ ویجت logo فقط show_title دارد (لوگو همیشه از تنظیمات سایت). nav هدر و links فوتر: links[] با آیتم {kind: page|custom، page_id?، label?، href?، children?} — شکل قدیمی {label, href} یعنی custom. والد custom دارای فرزند href اختیاری دارد. children همین مدل تا عمق ۲ (هر والد حداکثر ۸ فرزند، سطح اول حداکثر ۱۲). kind=page در خروجی عمومی با title/url زنده غنی می‌شود.'
        layout:
          type: object
          description: 'چیدمان ناحیه؛ فوتر: columns (۱ تا ۴) — خالی/نامعتبر = تعداد واقعی ستون‌ها (۱ تا ۴).'
          properties:
            columns: { type: integer, minimum: 1, maximum: 4 }
    ChromeLinkItem:
      type: object
      description: 'آیتم لینک رزولوشده در کروم عمومی: page با title/url زنده از صفحه منتشرشده؛ custom دستی؛ children تودرتو تا عمق ۲. آیتم خراب (صفحه حذف/منتشرنشده) با کل زیرشاخه‌اش حذف می‌شود.'
      properties:
        kind: { type: string, enum: [page, custom] }
        page_id: { type: integer, nullable: true }
        label: { type: string }
        href: { type: string }
        title: { type: string, nullable: true, description: 'فقط kind=page — عنوان زنده صفحه' }
        url: { type: string, nullable: true, description: 'فقط kind=page — نشانی زنده صفحه (‎/slug)' }
        children:
          type: array
          description: 'زیرمنوی کشویی (همین مدل؛ حداکثر عمق ۲)'
          items: { $ref: '#/components/schemas/ChromeLinkItem' }
    SidePreset:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, example: 'ستون راست فروشگاه' }
        side: { type: string, enum: [left, right] }
        blocks: { type: array, items: { type: object } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SiteChrome:
      type: object
      properties:
        title: { type: string, example: 'فروشگاه نمونه' }
        description: { type: string }
        logo_url: { type: string, nullable: true }
        favicon_url: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        site_url: { type: string, nullable: true, description: 'نشانی پایه سایت — canonical و OG:url' }
        og_image_url: { type: string, nullable: true, description: 'تصویر پیش‌فرض OG/Twitter' }
        ai_summary: { type: string, description: 'خلاصه سایت برای llms.txt و GEO' }
        robots_index: { type: boolean, description: 'اجازه ایندکس کل سایت' }
        address: { type: string, nullable: true }
        locale: { type: string, example: fa, description: 'زبان پیش‌فرض سایت (دسته UIUX)' }
        timezone: { type: string, example: Asia/Tehran, description: 'منطقه زمانی سایت (دسته UIUX)' }
        homepage_page_id: { type: integer, nullable: true, description: 'صفحه خانه تنظیم‌شده (کار دوم)' }
        homepage_slug: { type: string, nullable: true, description: 'اسلاگ منتشرشده صفحه خانه (کار دوم)' }
        header: { $ref: '#/components/schemas/LayoutPayload' }
        footer: { $ref: '#/components/schemas/LayoutPayload' }
        socials: { type: array, items: { $ref: '#/components/schemas/SocialLink' } }
        theme:
          type: object
          nullable: true
          properties:
            name: { type: string }
            slug: { type: string }
            version: { type: string }
            globals: { type: object }
    Error:
      type: object
      properties:
        message: { type: string }
  responses:
    InvalidCredentials:
      description: اعتبار نامعتبر (یکسان برای ایمیل ناشناس/رمز اشتباه/کد 2FA اشتباه)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: 'اعتبار ورود نامعتبر است.' }
    Unauthorized:
      description: توکن missing/نامعتبر
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: قفل بروت‌فورس (۱۰ تلاش در ۱۵ دقیقه)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: 'تلاش‌های ورود بیش از حد مجاز است. لطفاً دقایقی دیگر تلاش کنید.' }
    ValidationError:
      description: خطای اعتبارسنجی ورودی
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              errors: { type: object }
    NotFound:
      description: رکورد یافت نشد
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
