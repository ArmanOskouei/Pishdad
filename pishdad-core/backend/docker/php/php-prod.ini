; پروفایلِ تولید — همان 99-local.ini ولی با پیکربندیِ ایمیجِ produce.
; استفاده: ایمیجِ تولید این فایل را جای php.ini کپی می‌کند:
;   COPY docker/php/php-prod.ini /etc/php85/conf.d/99-local.ini
;
; تفاوت‌های آگاهانه با نسخهٔ توسعه:
;   - validate_timestamps=0: کد از ایمیج می‌آید، پس هر stat بازنویسیِ کشِ
;     opcode اتلاف است. نیاز به ری‌استارت بعد از دیپلوی (که deploy می‌کند).
;   - enable_cli=0: cron/queue در ایمیجِ produce از فایل‌های کش‌شدهٔ بیلد
;     سود می‌برند و startup هر بار map نمی‌کنند.
;   - revalidate_freq دیگر بی‌اثر است (timestamps خاموش).
memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 20M
date.timezone = UTC
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.save_comments = 1
realpath_cache_size = 4096K
realpath_cache_ttl = 600

display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
expose_php = Off
max_execution_time = 120
max_input_time = 120
cgi.fix_pathinfo = 0
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
zend.exception_ignore_args = Off
