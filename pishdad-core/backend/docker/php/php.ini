memory_limit = 512M
; PF-5: اینها با `client_max_body_size 20M` در nginx یکی شدند. قبلاً
; upload_max=64M ولی nginx روی 20M می‌برید ⇒ کاربر ۴۱۳ خامِ nginx می‌گرفت
; در حالی که پیامِ لاراول از ۶۴M حرف می‌زد. یک سقف، یک پیام.
upload_max_filesize = 20M
post_max_size = 20M
date.timezone = UTC
opcache.enable_cli = 1

; PF-6: پیش‌فرض‌های آلپاین (بدون php.ini رسمی) اینها را باز می‌گذارند.
; صفحهٔ ۵۰۰ نباید مسیر فایل/نسخه را لو بدهد؛ خطاها به `docker logs` بروند.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
expose_php = Off
max_execution_time = 120
max_input_time = 120
; NG-9/PF-6: کلاسیک‌ترین ضعفِ path-info.
cgi.fix_pathinfo = 0
; کوکیِ سشن سخت‌شده (Laravel/Sanctum خودش secure را از APP_URL تنظیم می‌کند).
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
; استک‌تریس‌های کامل به لاگ برسد.
zend.exception_ignore_args = Off

; PERF (dev روی بایند-mount ویندوز): هر stat فایل PHP از روی virtiofs
; میلی‌ثانیه‌ها طول می‌کشد و صدها فایل لاراول در هر ریکوئست stat می‌شدند
; (۱.۵ تا ۴ ثانیه برای هر کلیک با فاصله بیش از revalidate_freq).
; با پنجره ۶۰ ثانیه‌ای، کلیک‌های پشت‌سرهم از opcodes کش استفاده می‌کنند (~۷۰ms).
; بها: تغییر فایل PHP تا حداکثر ۶۰ ثانیه بعد دیده می‌شود؛ برای اعمال فوری:
;   docker restart pishdad-app
;
; ⚠️ PF-4: این مقادیر *توسعه*اند. ایمیجِ تولید باید
; `opcache.validate_timestamps=0` + `opcache.enable_cli=0` داشته باشد (فایلِ
; php-prod.ini). یک ایمیجِ واحد با هر دو نمی‌تواند هم bind-mount را تازه
; نگه دارد و هم کوکیِ opcache را کامل قفل کند.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
realpath_cache_size = 4096K
realpath_cache_ttl = 600
