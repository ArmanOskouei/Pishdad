[global]
daemonize = no

[www]
listen = 9000
; PF-1 (structural, tracked): این ایمیجِ *توسعه* است و root اجرا می‌شود تا با
; bind-mount ویندوز تصادم نداشته باشد. فایلِ جدا (zz-docker-prod.conf) برای
; ایمیجِ تولید با user=www-data لازم است — تصمیمِ مالک، چون مسیرِ نصب
; (Dockerfile.prod + compose.prod) را عوض می‌کند. تا آن زمان هیچ‌کس این
; ایمیج را روی سرورِ عمومی نسازد.
user = root
group = root

; PF-3: قبلاً پنل کاملاً پیش‌فرض بود (pm=dynamic، max_children=5). با
; memory_limit=512M بدترین حالت نزدیک به ۲.۵GB RSS است. ondemand فقط
; وقتی درخواست هست بیدار می‌شود و بعد از ۱۵ ثانیه بی‌کار می‌خوابد.
pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 15s
; سقف عمر هر ورکر: نشتِ حافظهٔ آرامی در طولانی‌مدت جمع نمی‌شود.
pm.max_requests = 500

; PF-3: بدون این، یک برون‌بری/پشتیبانِ گیرکرده تا ابد یک ورکر را نگه می‌دارد.
; P-04 همان کار را به بیرونِ درخواست می‌برد؛ این تایم‌اوت تورِ ایمنی است.
request_terminate_timeout = 300s

; PF-3: خروجیِ خطای ورکرها و کندلاگ به stderr (یعنی `docker logs`) برسد،
; نه اینکه در کانتینر گم شود.
catch_workers_output = yes
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /dev/stderr
php_admin_value[memory_limit] = 512M
; کارِ کند‌تر از ۵ ثانیه در لاگ بیاید (تشخیصِ گلوگاه بدون ابزارِ خارجی).
request_slowlog_timeout = 5s
slowlog = /dev/stderr
