[global]
daemonize = no

[www]
listen = 9000
; PF-1: ایمیجِ تولید هرگز root نیست. کاربرِ www-data (از پکیج‌های php85 یا
; `adduser -D -u 82 www-data`) باید مالکِ storage و bootstrap/cache باشد.
user = www-data
group = www-data

; همان عاقلانه‌های نسخهٔ توسعه (ondemand ...) اینجا تکرار می‌شوند تا دو
; فایل از هم مستقل بمانند — توسعه ممکن است آن یکی را عوض کند.
pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 15s
pm.max_requests = 500

request_terminate_timeout = 300s
catch_workers_output = yes
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /dev/stderr
php_admin_value[memory_limit] = 512M
request_slowlog_timeout = 5s
slowlog = /dev/stderr
