server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # API-only: small bodies, no uploads through PHP yet (MinIO presigned later)
    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # رسانه‌های کاربر روی دیسک محلی.
    #
    # ⚠️ چها این block جاا لازم است و `try_files` کافی نیست:
    #
    # `artisan storage:link` یک symlink می‌سازد که به
    # `/var/www/html/storage/app/public` اشاره می‌کند. ولی در این ترکیب
    # کانتینر `pishdad-web` **فقط** `public/` را mount دارد، پس آن مسیر در آن
    # کانتینر وجود ندارد و nginx به ۴۰۳ می‌دهد — بی‌آنکه
    # خطایی در لاگ نیفتد یا PHP فرصتِ توصیحشاش‌اش را پیدا نکند.
    #
    # یعنی نصب کاملاً سلام به نظر می‌رسد و فقط *تصاویر* خراب اند.
    #
    # راه درست این است که مسیرٔ فیزیکی سرو شود، نه symlink. و چون هر دو
    # کانتینر یک منبعٔ مشترک دارند، `root` اینجا می‌تواند
    # `storage/app/public` اشاره کند.
    location /storage/ {
        alias /var/www/html/storage/app/public/;

        # ⚠️ فایل‌های آپلودی کاربر **نباید** اجرا شود. بدون این، یک
        # `.php` که somehow آپلود شده مستقیم اجرا می‌شود.
        location ~ \.php$ {
            deny all;
        }

        # فایلِ نبودنی نباید به `index.php` بیفتد (که یک JSON 404 می‌دهد
        # و مرورگر آن را به‌عنوان تصویر‌ شکسته تفسیر می‌کند).
        add_header X-Content-Type-Options "nosniff";
        expires 7d;
        access_log off;
    }

    location ~ /\.ht {
        deny all;
    }
}
