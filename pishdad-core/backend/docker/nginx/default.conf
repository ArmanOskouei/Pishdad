# Pishdad web tier (API-only Laravel behind nginx).
#
# NG-1..NG-11 — همهٔ بلوک‌های زیر در http-context مجازند (conf.d داخل http
# include می‌شود)، پس نیازی به دست‌زدنِ nginx.conf اصلی نیست.

# ── NG-6: محدودسازی نرخ در لبه ────────────────────────────────────────────
# اپلیکیشن throttle دارد (throttle:auth-login و…)؛ این لایهٔ دفاعی است تا
# سیلِ درخواست‌ها پیش از رسیدن به php-fpm مهار شود.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_req_status 429;

# ── NG-10: لاگِ قابلِ تحلیل (زمانِ درخواست و صرف‌نظرِ بالا) ───────────────
log_format pishdad '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    'rt=$request_time urt=$upstream_response_time '
                    '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # NG-5: نسخهٔ nginx در هدرها و صفحات خطا پخش نشود.
    server_tokens off;

    access_log /var/log/nginx/access.log pishdad;
    error_log /var/log/nginx/error.log warn;
    # NG-11: اسکنِ ۴۰۴ربات‌ها لاگِ خطا را پر نکند.
    log_not_found off;

    # API-only: small bodies, no uploads through PHP (MinIO presigned later)
    client_max_body_size 20M;

    # ── NG-4: تایم‌اوت‌ها ────────────────────────────────────────────────
    # پیش‌فرضِ fastcgi_read_timeout شصت ثانیه است ⇒ هر کارِ طولانیِ واقعی
    # (نصب افزونه، برون‌بری، backup:run با pg_dump) با ۵۰۴ می‌شکست.
    fastcgi_read_timeout 300s;
    fastcgi_send_timeout 300s;
    send_timeout 30s;
    keepalive_timeout 65s;

    # ── NG-2: فشرده‌سازی ────────────────────────────────────────────────────
    # JSONِ API و فایل‌های متنی حدودِ ۵۵–۷۰٪ کوچک می‌شوند. brotli در ایمیجِ
    # رسمی alpine نیست و نیازی هم نیست: gzip همان سودِ عمده را می‌دهد.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        application/json
        application/javascript
        application/x-javascript
        text/javascript
        text/css
        text/plain
        text/xml
        application/xml
        image/svg+xml
        application/rss+xml
        application/manifest+json;

    # ── NG-1: هدرهای امنیتی (سراسرِ سرور) ───────────────────────────────────
    # `always` تا روی خطاهای ۴xx/۵xx هم بیایند.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    # HSTS فقط وقتی TLS در همین لبه تمام می‌شود معنا دارد — روی HTTP خالص
    # مرورگر آن را نادیده می‌گیرد، پس بی‌خطر است ولی تا راه‌اندازی TLS
    # کامنت بماند (NG-8).
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        # NG-6: سقفِ نرخ عمومی (burst برای اسکرول/نوارهای پنل کافی است).
        limit_req zone=api burst=40 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # NG-6: مسیرهای احراز هویت با سقفِ سخت‌تر (ضدِ brute-force لبه‌ای؛
    # اپ خودش هم throttle دارد).
    location ^~ /api/v1/auth/ {
        limit_req zone=auth burst=5 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # NG-9: بدون این، نبودِ فایل به «primary script unknown»ِ خودِ FPM
        # سپرده می‌شود و cgi.fix_pathinfo کلاسیک می‌شود.
        try_files $uri =404;
    }

    # ── NG-3: دارایی‌های ایستا — کشِ مرورگر ─────────────────────────────────
    # /storage عمداً prefixِ ^~ گرفته تا این ریجکس روی آن اجرا نشود (مسیرِ
    # فیزیکیِ storage با alias سرو می‌شود، نه با root).
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;

        # ⚠️ فایل‌های آپلودی کاربر **نباید** اجرا شود. بدون این، یک
        # `.php` که somehow آپلود شده مستقیم اجرا می‌شود.
        location ~ \.php$ {
            deny all;
        }

        # فایلِ نبودنی نباید به `index.php` بیفتد (که یک JSON 404 می‌دهد
        # و مرورگر آن را به‌عنوان تصویرِ شکسته تفسیر می‌کند).
        add_header X-Content-Type-Options "nosniff";
        add_header Cache-Control "public, max-age=604800";
        expires 7d;
        access_log off;
    }

    location ~* \.(?:css|js|woff2?|ttf|avif|svg|png|jpe?g|webp|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # NG-7: نقطه‌فایل‌ها — یک بلوکِ درست به‌جای نمونهٔ آپاچی‌شکلِ `\.ht`.
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
