name: ${PISHDAD_PROJECT:-pishdad-backend}

# CP-4: بدون سقف، درایور json-file لاگ را تا پر شدنِ دیسک می‌نویسد — و پر
# شدنِ دیسک با خودش Postgres را می‌کُشد. همهٔ سرویس‌ها این را ارث می‌برند.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Single-command boot:  docker compose up -d --build
# API: http://localhost:8080/api/v1/...   MinIO console: http://localhost:9101
services:
  app:
    build: .
    container_name: ${PISHDAD_APP:-pishdad-app}
    restart: unless-stopped
    # CP-5: سقفِ حافظه — پیش‌تر بی‌سقف بود و یک خروجی/آپلودِ سنگین می‌توانست
    # کل میزبان را ببرد. 1g برای php-fpm با memory_limit=512M کافی است.
    mem_limit: ${PISHDAD_APP_MEM:-1g}
    logging: *default-logging
    # NOTE: no `env_file` on purpose. The bind-mounted `.env` FILE is the single
    # source Laravel reads (via Dotenv). Injecting it into the process env too
    # would shadow phpunit.xml `<env force>` in tests (PHP $_SERVER wins over
    # putenv) and freeze values from container creation time. Only overrides
    # the entrypoint/compose network needs are passed here.
    environment:
      DB_HOST: db
      DB_PORT: 5432
      # ⚠️⛔ اینجا `DB_DATABASE` نگذارید. (E63)
      #
      # یک نسخهٔ پیشین آن را روی `cms` گذاشته بود و نتیجه یک تناقضِ بی‌صدا بود:
      # php-fpm محیطِ پروسه را پاک می‌کند (`clear_env`)، پس برنامه از **فایلِ
      # `.env`** مقدار می‌گرفت، ولی `artisan`/CLI متغیرِ پروسه را ترجیح می‌داد.
      # یعنی وب و خطِ فرمان به **دو دیتابیسِ مختلف** وصل می‌شدند: نصب‌کننده در
      # گام ۲ نام را در `.env` می‌نوشت، ولی هر `db:seed` دستی در دیتابیسِ دیگری
      # می‌نشست — و قالب‌ها در پنل خالی می‌ماندند در حالی که در دیتابیس بودند.
      #
      # نامِ دیتابیس را **نصب‌کننده** در `.env` می‌نویسد؛ همان باید تنها منبع
      # باشد. اینجا نسپارید تا وب و CLI همیشه یک دیتابیس ببینند.
      DB_USERNAME: cms
      DB_PASSWORD: cmssecret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # CP-6: اپ readiness برای --wait و healthcheck.
      PISHDAD_HEALTHCHECK: "1"
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── CP-1: frontend. Without this service, deploy.sh step 7 built the app
  # and ran nothing, then printed success. Only `web` publishes a host port
  # and proxies here, so the browser is same-origin (no CORS at all).
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_SITE_ID: ${NEXT_PUBLIC_SITE_ID:-}
    image: pishdad-frontend:${PISHDAD_IMAGE_TAG:-latest}
    container_name: ${PISHDAD_FRONTEND:-pishdad-frontend}
    restart: unless-stopped
    mem_limit: ${PISHDAD_FRONTEND_MEM:-768m}
    logging: *default-logging
    expose:
      - "3000"
    volumes:
      # MUST be ../frontend/config, not ./config: relative compose paths are
      # resolved against THIS file's directory. ./config would be backend/config
      # (empty) and the installer would silently see a fresh install.
      - ${PISHDAD_FE_CONFIG_DIR:-../frontend/config}:/app/config
    environment:
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://web/api}
      # Points at the path; the bytes come from the volume above (the secret
      # must not appear in `docker inspect`).
      PISHDAD_CONFIG_FILE: /app/config/runtime.json
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      NODE_ENV: production
    depends_on:
      web:
        condition: service_healthy

  # P-04/P-05 — ورکرِ صف. چرا سرویسِ جدا و نه داخلِ `scheduler`: موتورِ
  # تصویر (GD/Imagick) روی فایلِ بزرگ می‌تواند از سقفِ حافظهٔ scheduler بزند
  # و OOM شدنش یعنی از کار افتادنِ **زمان‌بند**، نه فقط یک تصویر. جدایی ⇒
  # سقفِ مستقل و تایم‌اوتِ واقعی. راننده `database` است (جدول jobs موجود)
  # نه Redis: Redis اینجا کش/سشن/ISR است و payloadِ Job در آن رقابتِ بدی است.
  worker:
    build: .
    container_name: ${PISHDAD_WORKER:-pishdad-worker}
    restart: unless-stopped
    mem_limit: ${PISHDAD_WORKER_MEM:-1g}
    logging: *default-logging
    command: ["php", "artisan", "queue:work", "--sleep=1", "--timeout=900", "--max-time=3600"]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      # ⚠️⛔ اینجا هم `DB_DATABASE` نگذارید. (E63 — مثل سرویس app)
      DB_USERNAME: cms
      DB_PASSWORD: cmssecret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # CP-6: اپ readiness برای --wait و healthcheck.
      PISHDAD_HEALTHCHECK: "1"
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # E76 — تیکِ دائمیِ صفِ تحویل (و زمان‌بندِ لاراول).
  #
  # چرا سرویسِ جدا و نه cron هاست: با هر نصب بالا می‌آید، به OS هاست وابسته
  # نیست و با `restart: unless-stopped` از ری‌استارت برمی‌گردد. `schedule:work`
  # هر دقیقه `schedule:run` می‌زند، پس `outbox:drain` (صفِ ایمیل/تلگرام/…) و
  # بقیهٔ کارهای زمان‌بندی واقعاً اجرا می‌شوند — پیش از این هیچ tickای نبود و
  # سطرهای صف برای همیشه pending می‌ماندند.
  #
  # entrypoint بیلد/انتظار/آماده‌سازی را مثل app می‌گذراند و بعد commandِ اینجا
  # جای php-fpm می‌نشیند. پورتی ندارد؛ نامش مثل بقیه قابلِ بازنویسی است (E37).
  scheduler:
    build: .
    container_name: ${PISHDAD_SCHEDULER:-pishdad-scheduler}
    restart: unless-stopped
    mem_limit: ${PISHDAD_SCHEDULER_MEM:-768m}
    logging: *default-logging
    command: ["php", "artisan", "schedule:work"]
    environment:
      DB_HOST: db
      DB_PORT: 5432
      # ⚠️⛔ اینجا هم `DB_DATABASE` نگذارید. (E63 — مثل سرویس app)
      DB_USERNAME: cms
      DB_PASSWORD: cmssecret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # CP-6: اپ readiness برای --wait و healthcheck.
      PISHDAD_HEALTHCHECK: "1"
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: nginx:1.31.6-alpine
    container_name: ${PISHDAD_WEB:-pishdad-web}
    restart: unless-stopped
    mem_limit: ${PISHDAD_WEB_MEM:-128m}
    logging: *default-logging
    environment:
      # CP-6: تنها قراردادِ پورت. روی VPS بی‌متغیر => ۸۰، یعنی رفتارِ امروز.
      WEB_PORT: ${WEB_PORT:-80}
      # ⛔ بدون این، envsubst هر $var ناشناخته را خالی می‌گذارد و nginx با
      # «invalid port» بالا نمی‌آید. فیلتر، جایگزینی را به WEB_PORT محدود می‌کند.
      NGINX_ENVSUBST_FILTER: '^WEB_PORT$'
    ports:
      - "${PISHDAD_WEB_PORT:-8080}:${WEB_PORT:-80}"
    volumes:
      # ⚠️ به templates/ نه conf.d/ — موتورِ envsubst ایمیج رسمی فقط آنجا را
      # پردازش می‌کند.
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./docker/nginx/proxy_params_pishdad.conf:/etc/nginx/proxy_params_pishdad.conf:ro
      - ./public:/var/www/html/public:ro
      # ⚠️ این mount لازم است و قبلاً نبود ⇒ *تصاویر همه‌جا* خراب بودند.
      #
      # `public/storage` یک symlink است، ولی symlink به مسیری که در این
      # کانتینر وجود ندارد بی‌فایده است. کانتینر `web` فقط `public/` را
      # می‌بیند، نه `storage/` را. نتیجه: `artisan storage:link` «موفق»
      # گزارش می‌شد ولی nginx برای هر `/storage/…` ۴۰۳ می‌داد.
      #
      # پس مسیرِ فیزیکی را جداگانه mount می‌کنیم و `default.conf` آن را
      # با `alias` سرو می‌کند (بلوک `location /storage/`).
      #
      # فقط خواندنی: کاربر هیچ‌وقت نباید از راه HTTP چیزی اینجا بنویسد.
      - ./storage/app/public:/var/www/html/storage/app/public:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      # CP-6: edge liveness without PHP - the platform probe hits this.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${WEB_PORT:-80}/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  db:
    build: ./docker/postgres
    container_name: ${PISHDAD_DB:-pishdad-db}
    restart: unless-stopped
    # PG-2: با shared_buffers=256MB و shared Memory، 1.5g سقفِ معقول است.
    mem_limit: ${PISHDAD_DB_MEM:-1536m}
    logging: *default-logging
    environment:
      POSTGRES_DB: cms
      # S-03/CP-8: پیش‌فرض‌های توسعه درجا دارند ولی روی سرور حتماً با
      # `PISHDAD_DB_PASSWORD` (و کاربر) بازنویسی شوند — مقدار ثابتِ ضعیف
      # دیگر تنها گزینه نیست.
      POSTGRES_USER: ${PISHDAD_DB_USER:-cms}
      POSTGRES_PASSWORD: ${PISHDAD_DB_PASSWORD:-cmssecret}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # S-03: پیش‌تر `0.0.0.0:5433` بود ⇒ کل دیتابیس از شبکه قابلِ خواندن/نوشتن.
      # حالا فقط لوپ‌بک. اگر واقعاً به دسترسیِ از بیرون نیاز است (مثلاً ابزار
      # مدیریت روی میزبانِ دیگر) آگاهانه `${PISHDAD_DB_PORT} ` را عوض کنید.
      # Inside the compose network the app still uses db:5432 (see .env DB_PORT).
      - "127.0.0.1:${PISHDAD_DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    # PG-2: ایمیج پایه shared_buffers=128MB و work_mem=4MB است و روی کانتینرِ
    # بدون سقف، کوئری‌های تحلیلی دیسک sort می‌خورند. این مقادیر برای VPS
    # ۲–۴GB محافظه‌کارانه‌اند؛ log_min_duration_statement کوئریِ کند را می‌بینید.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=60
      - -c
      - log_min_duration_statement=500
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PISHDAD_DB_USER:-cms} -d cms"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # U10: 7.4.11 -> 8.10.2. Major, and this one is load-bearing — Redis backs
    # the cache, the session store and the queue, and the Next.js cacheHandler
    # sits on top of it. Pinned to an exact version rather than a floating tag
    # so the running server is recorded in the file instead of being whatever
    # the registry served on the day of the pull.
    image: redis:8.10.2-alpine
    container_name: ${PISHDAD_REDIS:-pishdad-redis}
    restart: unless-stopped
    mem_limit: ${PISHDAD_REDIS_MEM:-768m}
    logging: *default-logging
    # RD-1/RD-2: پیش‌تر هیچ maxmemory و هیچ پایداری نداشت ⇒ رشد بی‌مرز تا
    # OOM-kill (با خودش صف و سشن‌ها را می‌برد). سقف + AOF هر ثانیه:
    #   - noeviction عمدی است: وقتی پر شد، نوشتنِ کش با **خطای واضح** شکست
    #     می‌خورد، در عوضِ حذفِ خاموشِ سشن/صف که allkeys-lru انجام می‌دهد.
    command:
      - redis-server
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    ports:
      # S-02: پیش‌تر `0.0.0.0:6380` بدون هیچ رمزی بود ⇒ هر کسی در شبکه
      # می‌توانست سشن بخواند/سازد و Job تزریق کند. حالا فقط لوپ‌بک.
      - "127.0.0.1:${PISHDAD_REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    # RD-3: بدون healthcheck، app/scheduler پیش از آماده‌شدنِ Redis بالا
      # می‌آمدند و اولین درخواست‌ها ۵۰۰ می‌گرفتند.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # PINNED BY DIGEST (U1). Pinned to the content digest rather than to a tag,
    # because a tag is a promise the registry can break and this one has: see
    # docs/MINIO-U1.md for the full audit.
    #
    # What this digest is, verified on this host:
    #   quay.io/minio/minio:latest -> RELEASE.2025-09-07T16-13-09Z
    #   (docker exec pishdad-minio /usr/bin/minio --version; commit 07c3a429)
    #
    # Why not the tag `RELEASE.2025-10-15T17-29-55Z` that the audit calls for:
    # it cannot be fetched from here, so pinning it would break `docker compose
    # up` on every host that cannot reach quay either. Upstream is finished:
    #   - github.com/minio/minio is `archived: true` (API-confirmed), last push
    #     2026-04-24, so RELEASE.2025-10-15T17-29-55Z is the last release ever.
    #   - hub.docker.com minio/minio returns 404: the repo is gone, not just
    #     frozen. (The 2024-10-13 image cached on this machine is a pull from
    #     before the removal, which is what made it look like Docker Hub had it.)
    #   - quay.io answers 401 to an anonymous token request from this network.
    # So there is no tag, anywhere reachable, that is both the newest release and
    # pullable. Pinning the digest locks the exact bytes that are already
    # verified working here, and `docker compose pull` still works for anyone
    # with quay credentials.
    #
    # To move to the final upstream release, on a host with quay access:
    #   docker pull quay.io/minio/minio:RELEASE.2025-10-15T17-29-55Z
    #   docker image inspect quay.io/minio/minio:RELEASE.2025-10-15T17-29-55Z \
    #     --format '{{json .RepoDigests}}'
    #   # then replace the digest below with the one it prints, and re-run
    #   # `docker exec pishdad-minio /usr/bin/minio --version` to record the version.
    #
    # Known-unpatched: the pinned release predates RELEASE.2025-10-15, so the
    # CVE it fixes (privilege escalation via session-policy bypass on service
    # accounts / STS) is still open here and cannot be closed from upstream.
    # MinIO is a dev-local object store only. Do not expose it, and plan the
    # migration described in docs/MINIO-U1.md before real data lands in it.
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: ${PISHDAD_MINIO:-pishdad-minio}
    restart: unless-stopped
    mem_limit: ${PISHDAD_MINIO_MEM:-512m}
    logging: *default-logging
    environment:
      # CP-3/CP-8: همان درسِ db/redis — پیش‌فرض برای توسعه، بازنویسی روی سرور.
      MINIO_ROOT_USER: ${PISHDAD_MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${PISHDAD_MINIO_PASSWORD:-minioadmin123}
    ports:
      # S-02 هم‌خانواده: کنسول و API فقط روی لوپ‌بک. MinIO «فروشگاهِ آبجکتِ
      # محلی» است (کامنتِ U1) و هرگز نباید روی اینترنت باز باشد.
      - "127.0.0.1:${PISHDAD_MINIO_PORT:-9100}:9000"
      - "127.0.0.1:${PISHDAD_MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    # NOTE: quay image's /usr/bin/docker-entrypoint.sh arrives zeroed through
    # this network (exec format error); bypass it and run the server directly.
    entrypoint: /usr/bin/minio
    # No healthcheck: this image's helper binaries are unreliable on some
    # hosts (zeroed layer), and nothing depends on minio health —
    # minio-init waits with its own retry loop and creates the bucket.
    # (Manual check: curl http://localhost:9100/minio/health/live → 200.)

  # Auto-creates the `cms` bucket on first boot (idempotent).
  minio-init:
    # Pinned (U1). Verified: the `mc` binary in this image really is
    # RELEASE.2025-08-13T08-35-41Z (commit 7394ce0d), which is the newest `mc`
    # release that will ever exist — github.com/minio/mc is `archived: true`
    # like the server. So this pin is final, not provisional, and there is no
    # upgrade left on the table here. Left as a tag rather than a digest only
    # because it is idempotent infra: it runs once, creates a bucket, exits.
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: ${PISHDAD_MINIO_INIT:-pishdad-minio-init}
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        # توجه: `$$` در compose یعنی «یک $ واقعی برای شل» — وگرنه compose
        # خودش این متغیرها را خالی جایگزین می‌کند.
        MINIO_USER="${PISHDAD_MINIO_USER:-minioadmin}"
        MINIO_PASS="${PISHDAD_MINIO_PASSWORD:-minioadmin123}"
        # CP-10: حلقهٔ بی‌پایان جای خود را به ۳۰ تلاشِ محدود داد. قبلاً اگر
        # MinIO بالا نمی‌آمد این کانتینر تا ابد سکوت می‌کرد و کسی متوجه
        # نبودنِ سطل نمی‌شد.
        i=0
        until [ "$$i" -ge 30 ]; do
          mc alias set local http://minio:9000 "$$MINIO_USER" "$$MINIO_PASS" >/dev/null 2>&1 && break
          i=$$((i+1)); sleep 2
        done
        if [ "$$i" -ge 30 ]; then echo "ERROR: minio unreachable after 60s"; exit 1; fi
        mc mb -p local/cms >/dev/null 2>&1 || true
        # CP-3: `mc anonymous set download` سطل را برای هر کسی روی اینترنت
        # قابلِ دانلود می‌کرد — در حالی که env.production.example می‌گوید رسانه
        # خصوصی است. حالا فقط با درخواستِ صریح (توسعهٔ محلی) باز می‌شود.
        if [ "${PISHDAD_MINIO_PUBLIC:-0}" = "1" ]; then
          mc anonymous set download local/cms >/dev/null 2>&1 || true
          echo "minio bucket ready (PUBLIC download - dev only)"
        else
          mc anonymous set none local/cms >/dev/null 2>&1 || true
          echo "minio bucket ready (private)"
        fi
    restart: "no"

volumes:
  pgdata:
  redisdata:
  miniodata:
